<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> خدمة مدارس احد </title>
    <link  rel="icon" type="image/png" href="artworks-LhIhfJhKVhbF9hts-wxiQkQ-t500x500.webp">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- الشاشة الترحيبية -->
    <div id="welcomeScreen" class="welcome-screen">
      <div class="welcome-logo">📘</div>
      <h1>خدمة مدارس أحد</h1>
      <p class="mb-4">كنيسة رئيس الملائكة ميخائيل والبابا كيرلس السادس
        بالبرشا</p>
      <button class="start-btn" id="startBtn">ابدأ الآن</button>
    </div>

    <!-- صفحة الفصول -->
    <div id="classPage" class="container mt-4">
      <h2>📚 الفصول</h2>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-primary" id="addClassBtn">
          <i class="bi bi-plus-circle me-1"></i> إضافة فصل
        </button>
      </div>
      <div class="mb-3">
        <input type="text" id="searchClassInput" class="form-control" placeholder="ابحث عن فصل...">
      </div>
      <div id="classList" class="row g-3"></div>
    </div>

    <!-- صفحة الطلاب -->
    <div id="studentSection" class=" mt-4">
      <h2 id="classTitle"></h2>
      <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-primary" id="addStudentBtn">
          <i class="bi bi-person-plus-fill me-1"></i> إضافة طالب
        </button>
        <button class="btn btn-secondary" id="backToClasses">
          <i class="bi bi-arrow-left-circle me-1"></i> رجوع للفصول
        </button>
      </div>
      <div class="mb-3">
        <input type="text" id="searchStudentInput" class="form-control" placeholder="ابحث عن طالب...">
      </div>
      <div class="table-responsive">
        <table
          class="table table-bordered table-striped text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th class="sticky-col  ">#</th>
              <th>الاسم</th>
              <th>الفصل</th>
              <th>العنوان</th>
              <th>الهاتف</th>
              <th>حضور</th>
              <th>غياب</th>
              <th>السجل</th>
              <th>أيام الحضور</th>
              <th>تعديل</th>

            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
      <div class="text-center mt-5">
        <button id="downloadPdfBtn" class="btn btn-secondary">تحميل نسخة
          PDF</button>
      </div>

    </div>

    <!-- المودالات -->
    <div class="modal fade" id="passwordModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">الرجاء إدخال كلمة المرور</h5></div>
          <div class="modal-body">
            <input type="password" id="passwordInput" class="form-control" placeholder="كلمة المرور">
            <div id="passwordError" class="text-danger mt-2 d-none">كلمة المرور غير صحيحة.</div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" id="submitPasswordBtn">دخول</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="addClassModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">إضافة فصل
              جديد</h5></div>
          <div class="modal-body">
            <input type="text" id="classNameInput" class="form-control"
              placeholder="اسم الفصل">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary"
              data-bs-dismiss="modal">إلغاء</button>
            <button class="btn btn-primary" id="saveClassBtn">حفظ</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="addStudentModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header "><h5 class="modal-title">إضافة طالب
              جديد</h5></div>
          <div class="modal-body">
            <input type="text" id="studentName" class="form-control mb-2"
              placeholder="اسم الطالب">
            <input type="text" id="studentClass" class="form-control mb-2"
              placeholder="الفصل">

            <input type="text" id="studentAddress" class="form-control mb-2"
              placeholder="العنوان">
            <input type="text" id="studentPhone" class="form-control"
              placeholder="رقم الهاتف">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary"
              data-bs-dismiss="modal">إلغاء</button>
            <button class="btn btn-primary" id="saveStudentBtn">حفظ</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
          <div class="modal-body text-center">
            <div
              class="alert alert-warning d-flex align-items-center justify-content-center"
              role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
              <div id="confirmMessage" class="fw-bold"></div>
            </div>
            <div class="mt-3">
              <button class="btn btn-danger px-4 mx-2" id="confirmYes">
                <i class="bi bi-trash3-fill me-1"></i> نعم
              </button>
              <button class="btn btn-secondary px-4 mx-2"
                data-bs-dismiss="modal">
                <i class="bi bi-x-circle me-1"></i> إلغاء
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>

  </body>
</html>
